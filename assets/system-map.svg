<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">From ideas to an AI product</title>
  <desc id="desc">An abstract engineering diagram connecting an input, a model, tools, and a product output.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 5.5 3.5 1 6" stroke="#8a929e" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="accent-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 5.5 3.5 1 6" stroke="#d9f99d" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Quiet construction guides keep the illustration architectural. -->
  <g stroke="#8a929e" stroke-opacity=".13" stroke-width="1">
    <path d="M16 60H544M16 338H544M179 36V364M381 36V364" stroke-dasharray="3 8"/>
    <path d="M22 54V66M16 60H28M538 54V66M532 60H544M22 332V344M16 338H28M538 332V344M532 338H544"/>
  </g>

  <!-- Input note -->
  <g>
    <text x="30" y="121" fill="#8a929e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">INPUT</text>
    <rect x="28" y="138" width="126" height="118" rx="8" stroke="#8a929e" stroke-opacity=".48"/>
    <path d="M28 167H154" stroke="#8a929e" stroke-opacity=".27"/>
    <circle cx="43" cy="152" r="2" fill="#d9f99d"/>
    <path d="M52 152H85" stroke="#eef0f3" stroke-opacity=".55" stroke-linecap="round"/>
    <g stroke="#8a929e" stroke-opacity=".55" stroke-linecap="round">
      <path d="M43 186H123M43 198H109M43 210H131"/>
    </g>
    <path d="M43 232H82" stroke="#d9f99d" stroke-linecap="round"/>
    <path d="M137 228 141 232 137 236" stroke="#8a929e" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Model block -->
  <g>
    <text x="216" y="87" fill="#8a929e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">MODEL</text>
    <rect x="210" y="105" width="150" height="187" rx="10" stroke="#d9f99d" stroke-opacity=".8"/>
    <path d="M226 121H245M226 121V140M344 121H325M344 121V140M226 276H245M226 276V257M344 276H325M344 276V257" stroke="#d9f99d" stroke-opacity=".45"/>
    <g stroke="#d9f99d" stroke-opacity=".4" stroke-width="1">
      <path d="M245 166 285 144 325 166 325 211 285 233 245 211Z"/>
      <path d="M245 166 285 188 325 166M285 144V188M285 188V233M245 211 285 188 325 211"/>
      <path d="M245 166 325 211M325 166 245 211" stroke-opacity=".2"/>
    </g>
    <g fill="#12161b" stroke="#d9f99d" stroke-width="1.3">
      <circle cx="245" cy="166" r="3.5"/><circle cx="285" cy="144" r="3.5"/>
      <circle cx="325" cy="166" r="3.5"/><circle cx="325" cy="211" r="3.5"/>
      <circle cx="285" cy="233" r="3.5"/><circle cx="245" cy="211" r="3.5"/>
    </g>
    <circle cx="285" cy="188" r="7" fill="#d9f99d"/>
    <circle cx="285" cy="188" r="14" stroke="#d9f99d" stroke-opacity=".3"/>
    <path d="M256 260H274M282 260H294M302 260H314" stroke="#8a929e" stroke-opacity=".65" stroke-linecap="round"/>
  </g>

  <!-- Tool interface -->
  <g>
    <text x="410" y="87" fill="#8a929e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">TOOLS</text>
    <rect x="404" y="105" width="128" height="84" rx="8" stroke="#8a929e" stroke-opacity=".48"/>
    <path d="M427 128C421 128 423 138 417 138C423 138 421 148 427 148M447 128C453 128 451 138 457 138C451 138 453 148 447 148" stroke="#eef0f3" stroke-opacity=".8" stroke-linecap="round"/>
    <path d="M441 129 433 147" stroke="#d9f99d" stroke-linecap="round"/>
    <path d="M472 132H513M472 144H501M420 171H451M463 171H483" stroke="#8a929e" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="514" cy="171" r="2.5" stroke="#d9f99d"/>
  </g>

  <!-- Product surface -->
  <g>
    <text x="410" y="225" fill="#8a929e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">OUTPUT</text>
    <rect x="404" y="241" width="128" height="84" rx="8" stroke="#d9f99d" stroke-opacity=".58"/>
    <path d="M404 262H532" stroke="#8a929e" stroke-opacity=".3"/>
    <circle cx="416" cy="252" r="1.5" fill="#8a929e"/><circle cx="423" cy="252" r="1.5" fill="#8a929e"/><circle cx="430" cy="252" r="1.5" fill="#8a929e"/>
    <path d="M449 252H519" stroke="#8a929e" stroke-opacity=".4" stroke-linecap="round"/>
    <rect x="417" y="275" width="28" height="35" rx="3" fill="#d9f99d" fill-opacity=".11" stroke="#d9f99d" stroke-opacity=".5"/>
    <path d="M425 292 429 296 437 287" stroke="#d9f99d" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M456 279H516M456 291H504M456 303H479" stroke="#eef0f3" stroke-opacity=".5" stroke-linecap="round"/>
  </g>

  <!-- Directed engineering flow -->
  <g stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M155 197H199" stroke="#8a929e" marker-end="url(#arrow)"/>
    <path d="M361 138H393" stroke="#8a929e" marker-end="url(#arrow)"/>
    <path d="M403 159H371" stroke="#8a929e" stroke-opacity=".5" marker-end="url(#arrow)"/>
    <path d="M361 270H393" stroke="#d9f99d" marker-end="url(#accent-arrow)"/>
    <path d="M468 190V206H546V347H91V267" stroke="#8a929e" stroke-opacity=".32" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
  </g>
  <text x="241" y="365" fill="#8a929e" fill-opacity=".65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" letter-spacing="1.5">ITERATE · EVALUATE · SHIP</text>
</svg>
